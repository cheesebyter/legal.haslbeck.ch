name: Monitor production

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: legal-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Configure Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0

      - name: Check HTTPS pages and internal links
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-production.js 2>&1 | tee monitor.log

      - name: Open or update failure issue
        if: steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[Monitor] legal.haslbeck.ch nicht vollständig erreichbar"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          {
            echo "Automatische Prüfung fehlgeschlagen."
            echo
            echo '```text'
            cat monitor.log
            echo '```'
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue-body.md
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file issue-body.md
          else
            gh label create monitoring --color B60205 --description "Automated availability monitoring" --force
            gh issue create --title "$title" --body-file issue-body.md --label monitoring
          fi

      - name: Close resolved failure issue
        if: steps.check.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[Monitor] legal.haslbeck.ch nicht vollständig erreichbar"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Die automatische Prüfung ist wieder erfolgreich."
          fi

      - name: Fail workflow when monitor failed
        if: steps.check.outcome == 'failure'
        run: exit 1
