name: Roll back production

on:
  workflow_dispatch:
    inputs:
      image:
        description: Full immutable GHCR image URI previously deployed
        required: true
        type: string
      commit:
        description: Corresponding 40-character Git commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate rollback target
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$IMAGE" == ghcr.io/*:* ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure controller SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ANSIBLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore selected image through Ansible
        shell: bash
        env:
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
          IMAGE: ${{ inputs.image }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ssh "$ANSIBLE_USER@$ANSIBLE_HOST" \
            "cd /mnt/vps-management/ansible && \
             ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_ansible_controller \
             ansible-playbook -i hosts.ini playbooks/43-delphi-deploy-legal-haslbeck.yml \
             -e legal_image='$IMAGE' -e legal_commit='$COMMIT'"

